# E1 RM-all continued from step 20 to 40 (same run dir), GPUs 4-7
defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# SC-GRPO: pi0.5 post-training inside the frozen dual-view Wan 41k, safety cost from SAM
# (cost_all_d32) as a Lagrangian penalty on the trajectory reward. All 40 LIBERO-Safety cells.
# Launch with CUDA_VISIBLE_DEVICES=2,3,4,5,6,7 (GPUs 0/1 belong to other jobs).
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 4-7

runner:
  task_type: embodied
  logger:
    log_path: "/data_cf/cws_sam/v1/scgrpo/causal/rmall"
    project_name: rlinf
    experiment_name: "scgrpo_causal_rmall"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: 40
  only_eval: False
  val_check_interval: -1    # real-grader eval runs separately on saved checkpoints
  save_interval: 20
  resume_dir: /data_cf/cws_sam/v1/scgrpo/causal/rmall/scgrpo_causal_rmall/checkpoints/global_step_20
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False     # rewards include -eta * cost and can be negative
  adv_std_floor: 0.1

env:
  group_name: "EnvGroup"
  train:
    env_type: world_model
    wm_env_type: libero
    safe: True
    seed: 0
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    rollout_epoch: 8
    max_chunks: 8
    max_episode_steps: 64
    max_steps_per_rollout_epoch: 64
    auto_reset: False
    ignore_terminations: False
    reward_coef: 1.0
    use_fixed_reset_state_ids: False
    is_eval: False
    video_cfg:
      save_video: False
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
    # world model + scoring
    model_path: /data_cf/wan_ac_sft/runs/s3_dual_b10/ema-step-41000.safetensors
    VAE_path: /mnt/nfs/fjj/wan_ac_sft/ckpt/RLinf-Wan-LIBERO-Spatial/Wan2.2_VAE.pth
    num_inference_steps: 5
    pose_scale: 8.0
    pose_clip: 4.0
    keyframe_dir: /data_cf/cws_sam/v1/scgrpo/keyframes_v1
    channel_mask: /data_cf/cws_sam/v1/scgrpo/channel_mask.json
    sam_path: /data_cf/cws_sam/v1/checkpoints/cost_all_d32/best.pt
    state_reader_path: /data_cf/cws_sam/v1/scgrpo/state_reg_v1/state_reg.pt
    state_offset: True
    main_image_size: 256
    wrist_image_size: 224
    reward_model:
      type: CWSRewardModel
      from_pretrained: /data_cf/cws_rm/runs/rm_v3_agent_w41k/best.pt
    success_threshold: 0.8
    success_consecutive: 4
    # Lagrangian cost constraint (SafeDojo-style top-M aggregation)
    cost_top_m: 16
    cost_budget: 0.13
    eta_lr: 0.0
    eta_init: 0.0
    sync_real: True
    reward_source: rm
    termination_source: rm             # success ends the episode by this arm reward
    terminate_on_real_violation: True  # violation handling identical to R1-all
    end_on_violation: True

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: /mnt/nfs/fjj/Code/rlinf-safety-runtime/checkpoints/pi05_libero_safety_rlinf
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 2048
  seed: 42
  enable_offload: True
  model:
    model_path: /mnt/nfs/fjj/Code/rlinf-safety-runtime/checkpoints/pi05_libero_safety_rlinf
    num_action_chunks: 8
    action_dim: 7
    num_steps: 5
    openpi:
      noise_level: 0.5
    openpi_data:
      norm_stats_path: ${..model_path}/assets/lerobot/norm_stats.json
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
